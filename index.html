<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTOWIN-13 | Script Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ดึงไฟล์ CSS สไตล์แต่งหน้าเว็บ -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <!-- Header Navbar -->
    <header>
        <div class="logo-area">
            <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
            <div class="logo-text">KTOWIN-13</div>
        </div>
        <div class="social-links">
            <a href="https://discord.gg/FETkmgVqc" target="_blank" class="social-btn btn-discord">
                <i class="fa-brands fa-discord"></i> Discord
            </a>
            <a href="https://youtube.com/@ktowin-13?si=YmncjXNoNQ1u6ibH" target="_blank" class="social-btn btn-youtube">
                <i class="fa-brands fa-youtube"></i> YouTube
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <!-- การ์ดดึงโค้ดสคริปต์จาก Render -->
        <div class="hero-card">
            <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 10px; color: #FFF;">
                <i class="fa-solid fa-code" style="color: var(--secondary);"></i> โค้ดสคริปต์ของคุณ
            </h3>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">
                กดปุ่มด้านล่างเพื่อสร้างและรับโค้ดสคริปต์ล่าสุดจากระบบ Render
            </p>
            
            <!-- กล่องข้อความแสดงโค้ด -->
            <textarea id="brandNewScriptBox" readonly placeholder="กดปุ่มด้านล่างเพื่อสร้างและรับโค้ด..." style="width: 100%; height: 130px; background: #111; color: #00ff88; border: 1px solid #444; border-radius: 10px; padding: 12px; font-family: monospace; font-size: 12px; box-sizing: border-box; resize: none; margin-bottom: 20px;"></textarea>
            
            <!-- ปุ่มกดดึงข้อมูล -->
            <button onclick="fetchBrandNewScript(this)" class="dl-btn btn-primary-dl">
                <i class="fa-solid fa-terminal"></i> กดเพื่อสร้างและรับโค้ด
            </button>
        </div>
    </div>
    
    <footer>
        <p>© 2026 KTOWIN-13 Hub. All rights reserved.</p>
    </footer>

    <!-- ดึงไฟล์ JavaScript สำหรับทำงาน -->
